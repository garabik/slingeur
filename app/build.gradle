plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.retro.slingeur'
    compileSdk 34

    defaultConfig {
        applicationId "app.retro.slingeur"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.1"
        // Evaluated when Gradle configures the build, i.e. once per actual
        // build invocation -- shown in Settings (see SettingsActivity) so a
        // installed APK's build can be told apart from another without
        // needing a separate version bump for every iteration during
        // development.
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${new Date().format('yyyy-MM-dd HH:mm')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "slingeur-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
